services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve"]
      interval: 3s
      retries: 10
    ports: ["5432:5432"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://eve:eve@db:5432/eve
      SECRET_KEY: change-me
      WEBHOOK_SECRET: change-me-too
      ADMIN_EMAILS: admin@example.com
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
